<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecofleet Map</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.31/"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #viewDiv { position: fixed; inset: 0; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; background: #FFFFFF; z-index: 999; pointer-events: none;
      font-family: "IBM Plex Sans", system-ui, sans-serif; color: #525252; font-size: 13px;
      font-weight: 500;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #E5E5E5; border-top-color: #16A34A;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><span id="loadingText">Loading map…</span></div>
  <div id="viewDiv"></div>
  <script>
    var view, routeLayer, stopLayer, vehicleLayer, mapReadySent = false;
    var filterRouteLayer = null, filterStopLayer = null;
    /** Labels for pinned-route stops — a FeatureLayer, so Esri declutters them. */
    var filterStopLabelLayer = null;
    // The city-wide network, drawn from the geodatabase (bus_line_kigali /
    // bus_stops_kigali, served by the backend) rather than the Bus_Lanes_BTS
    // FeatureServer. That published service still carries the retired STP-* stop
    // set and the pre-rebuild lines, so it no longer agrees with what the
    // backend serves. The dashboard feeds these layers via `setNetwork`.
    var networkRouteLayer = null, networkStopLayer = null;
    /** Kept so drawNetwork() can swap the stop layer in after init. */
    var mapObject = null;
    /** Below this scale the stop names appear; above it they would collide. */
    var STOP_LABEL_MIN_SCALE = 25000;
    var highlightGraphic = null, highlightStopId = null;
    var followingTripId = null;
    var pendingFocusTripId = null;
    var routeZoomSuppressedUntil = 0;
    var NAV_ZOOM = 18;
    var lastCamFollowAt = 0;
    // The operator grabbed the map while a trip was selected. Gates ONLY the
    // follow camera — `followingTripId` stays set, because it also drives the
    // route-progress paint and suppresses drawRoute's auto-zoom. Clearing the
    // trip here would freeze the progress line and hand the camera to a second
    // fight. Re-arms when a trip is (re)selected or its bus is clicked.
    var followCamReleased = false;

    // Route-filter overlay state. The dashboard can pin one or many routes on
    // the map independently of whichever trip is selected, so the two features
    // share the network-layer visibility rule in syncNetworkLayers().
    var routeFilterActive = false;
    var selectedRouteActive = false;
    var lastRouteFilterFitKey = null;

    /**
     * The network layers are background context. They hide as soon as the
     * operator narrows the map — by selecting a trip OR by pinning routes with
     * the filter — and return only when both are cleared. Hiding them is what
     * makes the filter read as a colour change: the blue base drops away and the
     * pinned routes come back in their own palette.
     */
    function syncNetworkLayers() {
      var visible = !routeFilterActive && !selectedRouteActive;
      if (networkRouteLayer) networkRouteLayer.visible = visible;
      if (networkStopLayer) networkStopLayer.visible = visible;
    }

    /** `{uuid}` and `uuid` must match for follow / marker updates. */
    function normalizeTripId(id) {
      if (id == null) return '';
      return String(id).replace(/[{}]/g, '').trim().toLowerCase();
    }
    function sameTripId(a, b) {
      var na = normalizeTripId(a);
      var nb = normalizeTripId(b);
      return na.length > 0 && na === nb;
    }
    function findVehicleEntry(tripId) {
      if (!tripId) return null;
      if (vehicleMarkers[tripId]) return vehicleMarkers[tripId];
      var want = normalizeTripId(tripId);
      var keys = Object.keys(vehicleMarkers);
      for (var i = 0; i < keys.length; i++) {
        if (normalizeTripId(keys[i]) === want) return vehicleMarkers[keys[i]];
      }
      return null;
    }
    function findVehicleKey(tripId) {
      if (!tripId) return null;
      if (vehicleMarkers[tripId]) return tripId;
      var want = normalizeTripId(tripId);
      var keys = Object.keys(vehicleMarkers);
      for (var j = 0; j < keys.length; j++) {
        if (normalizeTripId(keys[j]) === want) return keys[j];
      }
      return null;
    }
    var params = new URLSearchParams(window.location.search);
    var arcgisToken = params.get('token');
    var portalUrl = params.get('portal') || 'https://esrirw.rw/portal';
    /** Base colour for the whole geodatabase network. */
    var NETWORK_LINE_COLOR = [59, 130, 246, 0.85];   // #3B82F6
    var NETWORK_STOP_COLOR = [147, 197, 253, 0.95];  // #93C5FD

    function hideLoading() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    }

    function signalReady() {
      if (mapReadySent) return;
      mapReadySent = true;
      hideLoading();
      window.parent.postMessage({ type: 'mapReady', basemap: window.__basemapName || 'satellite' }, '*');
    }

    function initMap() {
      require([
        'esri/Map',
        'esri/views/MapView',
        'esri/layers/GraphicsLayer',
        'esri/layers/OpenStreetMapLayer',
        'esri/Basemap',
        'esri/identity/IdentityManager',
        'esri/config',
        'esri/core/reactiveUtils'
      ], function(Map, MapView, GraphicsLayer, OpenStreetMapLayer, Basemap, identityManager, esriConfig, reactiveUtils) {

        if (arcgisToken) {
          try {
            var expires = Date.now() + 7200000;
            // Portal generateToken (referer client) — needed for authenticated services.
            identityManager.registerToken({
              server: portalUrl.replace(/\/$/, '') + '/sharing/rest',
              token: arcgisToken,
              expires: expires,
              ssl: true
            });
            // FeatureServer lives on the ArcGIS Server host, not the portal.
            identityManager.registerToken({
              server: 'https://esrirw.rw/server',
              token: arcgisToken,
              expires: expires,
              ssl: true
            });
            identityManager.registerToken({
              server: 'https://esrirw.rw/server/rest/services',
              token: arcgisToken,
              expires: expires,
              ssl: true
            });
            // Belt-and-suspenders: attach the portal token to every service on
            // this ArcGIS Server, not just Bus_Lanes_BTS — the cartographic
            // bus-line layer lives under Hosted/ and needs the same token.
            // Only fills the token in when absent, so it cannot override one.
            esriConfig.request.interceptors.push({
              urls: /esrirw\.rw\/server\/rest\/services/i,
              before: function(params) {
                params.requestOptions = params.requestOptions || {};
                params.requestOptions.query = params.requestOptions.query || {};
                if (!params.requestOptions.query.token) {
                  params.requestOptions.query.token = arcgisToken;
                }
              }
            });
          } catch (e) {}
        }

        // The geodatabase network, drawn as graphics rather than published
        // FeatureLayers. Bus_Lanes_BTS still serves the retired STP-* stops and
        // the pre-rebuild lines, so it disagrees with the backend; the dashboard
        // pushes the current network in via `setNetwork` instead. Bottom of the
        // stack, so pinned routes, the selected trip and vehicles draw over it.
        networkRouteLayer = new GraphicsLayer({ title: 'Bus network', listMode: 'hide' });
        // networkStopLayer is built in drawNetwork() — it is a client-side
        // FeatureLayer, not a GraphicsLayer, because only a FeatureLayer can
        // label its features with a minScale and declutter the collisions.
        // ~700 stop names drawn as plain graphics would be a solid smear.

        filterRouteLayer = new GraphicsLayer({ title: 'Filtered routes', listMode: 'hide' });
        filterStopLayer = new GraphicsLayer({ title: 'Filtered route stops', listMode: 'hide' });
        routeLayer = new GraphicsLayer({ title: 'Selected route', listMode: 'hide' });
        stopLayer = new GraphicsLayer({ title: 'Selected stops', listMode: 'hide' });
        vehicleLayer = new GraphicsLayer({ title: 'Vehicles', listMode: 'hide' });

        var map = new Map({ basemap: 'satellite' });
        mapObject = map;
        // Bottom to top: the city network, then the pinned route filter, then
        // the selected trip and vehicles on top — a filtered route must never
        // paint over the trip an operator is actively watching. drawNetwork()
        // splices the stop layer in at index 1, straight above the lines.
        map.addMany([
          networkRouteLayer,
          filterRouteLayer,
          filterStopLayer,
          routeLayer,
          stopLayer,
          vehicleLayer
        ]);
        window.__basemapName = 'satellite';

        view = new MapView({
          container: 'viewDiv',
          map: map,
          center: [30.088, -1.946],
          zoom: 15,
          constraints: { minZoom: 8, maxZoom: 20 },
          ui: { components: [] }
        });

        // Hand the camera back the moment the operator navigates. Without this
        // the follow loop re-asserted center+zoom every 320 ms, so panning away
        // snapped back and zooming out below NAV_ZOOM was undone on the next
        // tick. `interacting` covers drag, wheel, pinch and keyboard nav, and is
        // false during our own goTo (that sets `animation` instead), so the
        // camera never releases itself. The explicit wheel handler is belt-and-
        // braces: a wheel notch can be over before `interacting` is sampled.
        reactiveUtils.watch(
          function() { return view.interacting; },
          function(isInteracting) { if (isInteracting) releaseFollowCamera(); }
        );
        view.on('mouse-wheel', releaseFollowCamera);

        // Stops carry `kind: 'stop'` on every layer that draws them, so a click
        // on a network stop reaches the dashboard the same way a selected-trip
        // or pinned-route stop does.
        view.on('click', function(event) {
          // networkStopLayer only exists once a network payload has arrived.
          var targets = [vehicleLayer, stopLayer, filterStopLayer];
          if (networkStopLayer) targets.push(networkStopLayer);
          view.hitTest(event, { include: targets }).then(function(res) {
            var vehicleHit = res.results.find(function(r) {
              return r.graphic && r.graphic.layer === vehicleLayer && r.graphic.attributes && r.graphic.attributes.tripId;
            });
            if (vehicleHit) {
              var tripId = vehicleHit.graphic.attributes.tripId;
              window.parent.postMessage({ type: 'vehicleClick', tripId: tripId }, '*');
              startFollow(tripId, true);
              return;
            }
            var stopHit = res.results.find(function(r) {
              return r.graphic && r.graphic.attributes && r.graphic.attributes.kind === 'stop';
            });
            if (stopHit) {
              var geom = stopHit.graphic.geometry;
              window.parent.postMessage({
                type: 'stopClick',
                stopId: stopHit.graphic.attributes.id,
                name: stopHit.graphic.attributes.name,
                longitude: geom && geom.longitude,
                latitude: geom && geom.latitude
              }, '*');
            }
          }).catch(function() {});
        });

        view.when(function() {
          signalReady();
        }).catch(function() {
          try {
            var osm = new OpenStreetMapLayer();
            map.basemap = new Basemap({ baseLayers: [osm], title: 'OpenStreetMap' });
            window.__basemapName = 'OpenStreetMap';
            view.when(function() { signalReady(); }).catch(function() { signalReady(); });
          } catch (err) {
            console.error('Map init failed:', err);
            signalReady();
          }
        });
      });
    }

    /**
     * Paint the whole city network from the geodatabase.
     *
     * Every route draws in one blue so the network reads as a single system;
     * colour is reserved for the route filter, where it distinguishes the routes
     * an operator has pinned. A dark casing under each line keeps it legible on
     * satellite imagery. Stops label only past `minScale`, otherwise ~700 labels
     * collide at city zoom.
     */
    /**
     * Map label for a stop: drop the trailing route tag the source appends to
     * per-direction platform records, e.g. "ADPR KANOMBE(127R)" -> "ADPR
     * KANOMBE". Only a tag that looks like a route code is removed, so a real
     * parenthetical such as "NDERA(GASIMA)" survives.
     */
    function stopLabel(name) {
      var s = String(name == null ? '' : name).trim();
      return s.replace(/\s*\(\s*\d+[A-Za-z]*\s*\)\s*$/, '').trim() || s;
    }

    /** Drop the pinned-route label layer; it is rebuilt on every filter change. */
    function clearFilterStopLabels() {
      if (filterStopLabelLayer && mapObject) mapObject.remove(filterStopLabelLayer);
      filterStopLabelLayer = null;
    }

    function drawNetwork(data) {
      if (!networkRouteLayer || !mapObject || !view) return;
      require([
        'esri/Graphic', 'esri/geometry/Point', 'esri/geometry/Polyline',
        'esri/layers/FeatureLayer', 'esri/symbols/SimpleLineSymbol'
      ], function(Graphic, Point, Polyline, FeatureLayer, SimpleLineSymbol) {

        networkRouteLayer.removeAll();

        (data.routes || []).forEach(function(route) {
          if (!route || !route.polyline || route.polyline.length < 2) return;
          var geom = new Polyline({ paths: [route.polyline] });
          networkRouteLayer.add(new Graphic({
            geometry: geom,
            symbol: new SimpleLineSymbol({
              color: [15, 23, 42, 0.55], width: 5, cap: 'round', join: 'round'
            })
          }));
          networkRouteLayer.add(new Graphic({
            geometry: geom,
            attributes: { kind: 'networkRoute', id: String(route.id), name: route.name },
            symbol: new SimpleLineSymbol({
              color: NETWORK_LINE_COLOR, width: 2.5, cap: 'round', join: 'round'
            }),
            popupTemplate: { title: '{name}' }
          }));
        });

        var oid = 0;
        var stopFeatures = (data.stops || []).reduce(function(acc, stop) {
          if (!isFinite(stop.longitude) || !isFinite(stop.latitude)) return acc;
          oid += 1;
          acc.push(new Graphic({
            geometry: new Point({ longitude: stop.longitude, latitude: stop.latitude }),
            // `kind` mirrors the GraphicsLayer stops so one click handler serves
            // the network, the pinned filter and the selected trip alike.
            // `label` drops the trailing route tag — "ADPR KANOMBE(127R)" reads
            // as "ADPR KANOMBE" on the map, while clicks still carry the full
            // name so the operator can tell the two platforms apart.
            attributes: {
              ObjectID: oid,
              kind: 'stop',
              id: String(stop.id),
              name: stop.name || '',
              label: stopLabel(stop.name)
            }
          }));
          return acc;
        }, []);

        // A client-side FeatureLayer has no applyEdits-free way to swap its
        // whole source, so rebuild and splice it back in above the lines.
        if (networkStopLayer) mapObject.remove(networkStopLayer);
        networkStopLayer = new FeatureLayer({
          title: 'Bus stops',
          listMode: 'hide',
          source: stopFeatures,
          objectIdField: 'ObjectID',
          geometryType: 'point',
          spatialReference: { wkid: 4326 },
          fields: [
            { name: 'ObjectID', type: 'oid' },
            { name: 'kind', type: 'string' },
            { name: 'id', type: 'string' },
            { name: 'name', type: 'string' },
            { name: 'label', type: 'string' }
          ],
          popupEnabled: false,
          renderer: {
            type: 'simple',
            symbol: {
              type: 'simple-marker',
              style: 'circle',
              color: NETWORK_STOP_COLOR,
              size: 5,
              outline: { color: [15, 23, 42, 0.8], width: 1 }
            }
          },
          // Names only once the operator has zoomed past a corridor's worth of
          // map. Esri drops colliding labels for us, so the survivors stay
          // readable instead of stacking into a smear.
          labelsVisible: true,
          labelingInfo: [{
            labelExpressionInfo: { expression: '$feature.label' },
            labelPlacement: 'above-center',
            minScale: STOP_LABEL_MIN_SCALE,
            deconflictionStrategy: 'static',
            symbol: {
              type: 'text',
              color: '#FFFFFF',
              haloColor: '#0F172A',
              haloSize: 1.6,
              font: { size: 9, weight: 'bold' }
            }
          }]
        });
        mapObject.add(networkStopLayer, 1);

        // Respect whatever narrowing is already in effect — a late-arriving
        // network payload must not pop back over a selected trip.
        syncNetworkLayers();
      });
    }

    function drawRoute(data) {
      if (!routeLayer || !view) return;
      require([
        'esri/Graphic', 'esri/geometry/Point', 'esri/geometry/Polyline',
        'esri/geometry/Extent', 'esri/symbols/SimpleMarkerSymbol',
        'esri/symbols/SimpleLineSymbol', 'esri/symbols/TextSymbol'
      ], function(Graphic, Point, Polyline, Extent, SimpleMarkerSymbol, SimpleLineSymbol, TextSymbol) {

        routeLayer.removeAll();
        stopLayer.removeAll();

        var polyline = data.polyline;
        var stops = data.stops || [];
        // Route workflow: only numbered stops on the selected trip route — hide
        // network-wide layers. Clearing the selection brings them back.
        selectedRouteActive = stops.length > 0 || !!(polyline && polyline.length >= 2);
        syncNetworkLayers();
        routePath = polyline && polyline.length >= 2 ? polyline : null;
        routeStopsCache = stops;
        lastProgressKey = '';

        if (polyline && polyline.length >= 2) {
          var followFe = findVehicleEntry(followingTripId);
          if (followFe) {
            paintRouteProgress(followFe.lon, followFe.lat);
          } else {
            paintRouteProgress(null, null);
          }

          // While routes are pinned, the filter owns the camera — otherwise the
          // selected trip's route would yank the view back off the pinned set.
          if (!routeFilterActive && !followingTripId && !pendingFocusTripId &&
              Date.now() >= routeZoomSuppressedUntil) {
            var lngs = polyline.map(function(c) { return c[0]; });
            var lats = polyline.map(function(c) { return c[1]; });
            view.goTo(new Extent({
              xmin: Math.min.apply(null, lngs) - 0.008,
              ymin: Math.min.apply(null, lats) - 0.008,
              xmax: Math.max.apply(null, lngs) + 0.008,
              ymax: Math.max.apply(null, lats) + 0.008
            }), { duration: 800 }).catch(function() {});
          }
        }

        stops.forEach(function(stop, i) {
          var pt = new Point({ longitude: stop.longitude, latitude: stop.latitude });
          var isOrigin = i === 0;
          var isDest = i === stops.length - 1;
          var stopAttrs = { kind: 'stop', id: String(stop.id), name: stop.name };
          stopLayer.add(new Graphic({
            geometry: pt,
            attributes: stopAttrs,
            symbol: {
              type: 'picture-marker',
              url: stopIconUrl(isOrigin ? '#16A34A' : isDest ? '#0A0A0A' : '#525252'),
              width: isOrigin || isDest ? '28px' : '24px',
              height: isOrigin || isDest ? '28px' : '24px'
            }
          }));
          stopLayer.add(new Graphic({
            geometry: pt,
            attributes: stopAttrs,
            symbol: new TextSymbol({
              text: (i + 1) + '. ' + stop.name,
              color: '#fff', haloColor: '#14532D', haloSize: 2, yoffset: 18,
              font: { size: 10, weight: 'bold' }
            })
          }));
        });

        applyHighlight(highlightStopId);
        tryFocusVehicle();
      });
    }

    /**
     * Draw the routes pinned by the dashboard's route filter.
     *
     * Each route gets its own colour (assigned dashboard-side so the legend and
     * the map agree) and is drawn as a white casing under a coloured line, which
     * is what keeps a thin line legible over satellite imagery. Intermediate
     * stops are small dots; the endpoints are larger and labelled with the route
     * name, so several routes can overlap without turning into noise.
     *
     * Deliberately NOT numbered like drawRoute's stops — numbering only means
     * something for a single trip's ordered journey.
     */
    function drawRouteFilter(data) {
      if (!filterRouteLayer || !view) return;
      require([
        'esri/Graphic', 'esri/geometry/Point', 'esri/geometry/Polyline',
        'esri/geometry/Extent', 'esri/layers/FeatureLayer',
        'esri/symbols/SimpleMarkerSymbol', 'esri/symbols/SimpleLineSymbol',
        'esri/symbols/TextSymbol'
      ], function(Graphic, Point, Polyline, Extent, FeatureLayer, SimpleMarkerSymbol, SimpleLineSymbol, TextSymbol) {

        filterRouteLayer.removeAll();
        filterStopLayer.removeAll();
        clearFilterStopLabels();

        var routes = (data.routes || []).filter(function(r) {
          return r && r.polyline && r.polyline.length >= 2;
        });

        routeFilterActive = (data.routes || []).length > 0;
        syncNetworkLayers();

        if (!routes.length) {
          lastRouteFilterFitKey = null;
          return;
        }

        var allLngs = [], allLats = [];
        var labelFeatures = [], labelOid = 0;

        routes.forEach(function(route) {
          var color = route.color || '#22D3EE';
          var path = route.polyline;
          var geom = new Polyline({ paths: [path] });

          filterRouteLayer.add(new Graphic({
            geometry: geom,
            symbol: new SimpleLineSymbol({
              color: [255, 255, 255, 0.9], width: 6, cap: 'round', join: 'round'
            })
          }));
          filterRouteLayer.add(new Graphic({
            geometry: geom,
            attributes: { kind: 'filterRoute', id: String(route.id), name: route.name },
            symbol: new SimpleLineSymbol({
              color: color, width: 3.5, cap: 'round', join: 'round'
            })
          }));

          path.forEach(function(c) { allLngs.push(c[0]); allLats.push(c[1]); });

          var stops = route.stops || [];
          stops.forEach(function(stop, i) {
            if (!isFinite(stop.longitude) || !isFinite(stop.latitude)) return;
            var isEnd = i === 0 || i === stops.length - 1;
            var pt = new Point({ longitude: stop.longitude, latitude: stop.latitude });
            filterStopLayer.add(new Graphic({
              geometry: pt,
              attributes: { kind: 'stop', id: String(stop.id), name: stop.name },
              symbol: new SimpleMarkerSymbol({
                style: 'circle',
                color: isEnd ? color : [255, 255, 255, 0.95],
                size: isEnd ? 11 : 6,
                outline: { color: isEnd ? [255, 255, 255, 0.95] : color, width: isEnd ? 2 : 1.5 }
              })
            }));
            // The origin already carries the route-name tag added below; a stop
            // name on the same point would sit right on top of it. Every other
            // stop, destination included, gets its name.
            if (i === 0) return;
            labelOid += 1;
            labelFeatures.push(new Graphic({
              geometry: pt,
              attributes: { ObjectID: labelOid, label: stopLabel(stop.name) }
            }));
          });

          // Label the origin end only — one tag per route, not per stop.
          var head = stops[0];
          if (head && isFinite(head.longitude) && isFinite(head.latitude)) {
            filterStopLayer.add(new Graphic({
              geometry: new Point({ longitude: head.longitude, latitude: head.latitude }),
              symbol: new TextSymbol({
                text: route.name,
                color: '#fff', haloColor: '#0F172A', haloSize: 2, yoffset: 14,
                font: { size: 11, weight: 'bold' }
              })
            }));
          }
        });

        // Stop names for the pinned routes, on their own client-side layer so
        // Esri declutters them. Unlike the city-wide network layer there is no
        // minScale: a pinned route is an explicit "show me this", so it labels
        // at whatever zoom the operator is on and simply drops the names that
        // do not fit. The markers stay on filterStopLayer; this layer is labels
        // only, hence the invisible renderer.
        if (mapObject && labelFeatures.length) {
          filterStopLabelLayer = new FeatureLayer({
            title: 'Pinned route stop names',
            listMode: 'hide',
            source: labelFeatures,
            objectIdField: 'ObjectID',
            geometryType: 'point',
            spatialReference: { wkid: 4326 },
            fields: [
              { name: 'ObjectID', type: 'oid' },
              { name: 'label', type: 'string' }
            ],
            popupEnabled: false,
            renderer: {
              type: 'simple',
              symbol: {
                type: 'simple-marker',
                style: 'circle',
                color: [0, 0, 0, 0],
                size: 1,
                outline: { color: [0, 0, 0, 0], width: 0 }
              }
            },
            labelsVisible: true,
            labelingInfo: [{
              labelExpressionInfo: { expression: '$feature.label' },
              labelPlacement: 'above-center',
              deconflictionStrategy: 'static',
              symbol: {
                type: 'text',
                color: '#FFFFFF',
                haloColor: '#0F172A',
                haloSize: 1.6,
                yoffset: 8,
                font: { size: 10, weight: 'bold' }
              }
            }]
          });
          var above = mapObject.layers.indexOf(filterStopLayer);
          if (above >= 0) {
            mapObject.add(filterStopLabelLayer, above + 1);
          } else {
            mapObject.add(filterStopLabelLayer);
          }
        }

        // Fit only when the pinned set actually changes — refitting on every
        // repaint would fight the operator every time they panned the map.
        var fitKey = data.fitKey == null ? null : String(data.fitKey);
        if (fitKey !== null && fitKey !== lastRouteFilterFitKey && allLngs.length) {
          lastRouteFilterFitKey = fitKey;
          followingTripId = null;
          pendingFocusTripId = null;
          view.goTo(new Extent({
            xmin: Math.min.apply(null, allLngs) - 0.008,
            ymin: Math.min.apply(null, allLats) - 0.008,
            xmax: Math.max.apply(null, allLngs) + 0.008,
            ymax: Math.max.apply(null, allLats) + 0.008,
            spatialReference: { wkid: 4326 }
          }), { duration: 800 }).catch(function() {});
        }
      });
    }

    function applyHighlight(stopId) {
      highlightStopId = stopId || null;
      if (!stopLayer) return;
      require(['esri/Graphic', 'esri/symbols/SimpleMarkerSymbol'], function(Graphic, SimpleMarkerSymbol) {
        if (highlightGraphic) { stopLayer.remove(highlightGraphic); highlightGraphic = null; }
        if (!highlightStopId) return;
        var target = stopLayer.graphics.find(function(g) {
          return g.attributes && g.attributes.kind === 'stop' && g.attributes.id === highlightStopId;
        });
        if (!target) return;
        highlightGraphic = new Graphic({
          geometry: target.geometry,
          symbol: new SimpleMarkerSymbol({
            style: 'circle',
            size: 26,
            color: [3, 105, 161, 0.15],
            outline: { color: '#16A34A', width: 3 }
          })
        });
        stopLayer.add(highlightGraphic);
        if (view && !followingTripId) {
          view.goTo(
            { center: target.geometry, zoom: Math.max(view.zoom, 16) },
            { duration: 600 }
          ).catch(function() {});
        }
      });
    }

    var vehicleMarkers = {};
    var VEHICLE_ANIM_MS = 4500;
    var vehicleAnimRunning = false;
    var svgIconCache = {};
    var routePath = null;
    var routeStopsCache = [];
    var lastProgressKey = '';

    /** Split [lng,lat][] at the nearest vertex — NEVER inject the bus GPS into
     *  the path (that drew a straight "link" line across buildings). */
    function splitRouteAtBus(path, lon, lat) {
      if (!path || path.length < 2) return null;
      var cosLat = Math.cos(lat * Math.PI / 180);
      var best = 0, bestD = Infinity;
      for (var i = 0; i < path.length; i++) {
        var dx = (path[i][0] - lon) * cosLat;
        var dy = path[i][1] - lat;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      // ~80 m — if the bus is off the polyline, don't fabricate a connector.
      var meters = Math.sqrt(bestD) * 111320;
      if (meters > 80) return null;

      var traversed = path.slice(0, Math.max(1, best + 1));
      var remaining = path.slice(Math.max(0, best));
      if (remaining.length < 2) remaining = path.slice(Math.max(0, path.length - 2));
      if (traversed.length < 2) traversed = path.slice(0, 2);
      return { traversed: traversed, remaining: remaining };
    }

    function paintRouteProgress(lon, lat) {
      if (!routeLayer || !routePath || routePath.length < 2) return;
      var key = (lon != null ? lon.toFixed(5) : '') + ':' + (lat != null ? lat.toFixed(5) : '');
      if (key && key === lastProgressKey) return;
      lastProgressKey = key;

      require([
        'esri/Graphic', 'esri/geometry/Polyline', 'esri/symbols/SimpleLineSymbol'
      ], function(Graphic, Polyline, SimpleLineSymbol) {
        routeLayer.removeAll();

        // Progress split only when the bus sits on the road geometry. Otherwise
        // paint the full route — never a straight bus→route shortcut.
        var split = (lon != null && lat != null) ? splitRouteAtBus(routePath, lon, lat) : null;
        if (split) {
          routeLayer.add(new Graphic({
            geometry: new Polyline({ paths: [split.traversed] }),
            symbol: new SimpleLineSymbol({
              color: [148, 163, 184, 0.85], width: 4, cap: 'round', join: 'round'
            })
          }));
          routeLayer.add(new Graphic({
            geometry: new Polyline({ paths: [split.remaining] }),
            symbol: new SimpleLineSymbol({
              color: [255, 255, 255, 0.95], width: 6, cap: 'round', join: 'round'
            })
          }));
          routeLayer.add(new Graphic({
            geometry: new Polyline({ paths: [split.remaining] }),
            symbol: new SimpleLineSymbol({
              color: '#16A34A', width: 3.5, cap: 'round', join: 'round'
            })
          }));
        } else {
          var full = new Polyline({ paths: [routePath] });
          routeLayer.add(new Graphic({
            geometry: full,
            symbol: new SimpleLineSymbol({ color: [255,255,255,0.95], width: 5, cap: 'round', join: 'round' })
          }));
          routeLayer.add(new Graphic({
            geometry: full,
            symbol: new SimpleLineSymbol({ color: '#16A34A', width: 3, cap: 'round', join: 'round' })
          }));
        }
      });
    }

    function refreshRouteProgressFromFollow() {
      var id = followingTripId;
      var fe = findVehicleEntry(id);
      if (!id || !fe) {
        if (routePath) paintRouteProgress(null, null);
        return;
      }
      paintRouteProgress(fe.lon, fe.lat);
    }

    function svgDataUri(svg) {
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    function stopIconUrl(color) {
      var key = 'stop:' + color;
      if (!svgIconCache[key]) {
        svgIconCache[key] = svgDataUri(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
          '<rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="' + color + '" stroke="#ffffff" stroke-width="2"/>' +
          '<rect x="6.5" y="4.5" width="11" height="11" rx="2" fill="#ffffff"/>' +
          '<rect x="8" y="6" width="8" height="3.8" rx="1" fill="' + color + '"/>' +
          '<circle cx="9.3" cy="13" r="1.1" fill="' + color + '"/>' +
          '<circle cx="14.7" cy="13" r="1.1" fill="' + color + '"/>' +
          '<circle cx="9.3" cy="17.3" r="1.7" fill="#ffffff"/>' +
          '<circle cx="14.7" cy="17.3" r="1.7" fill="#ffffff"/>' +
          '</svg>'
        );
      }
      return svgIconCache[key];
    }

    function carIconUrl() {
      return '/nav-car-marker.png?v=5';
    }

    function vehicleSymbol(heading) {
      return {
        type: 'picture-marker',
        url: carIconUrl(),
        width: '72px',
        height: '72px',
        angle: ((heading || 0) % 360 + 360) % 360
      };
    }

    function lerpHeading(a, b, p) {
      var d = ((b - a + 540) % 360) - 180;
      return (a + d * p + 360) % 360;
    }
    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }
    function bearing(fromLon, fromLat, toLon, toLat) {
      var toRad = Math.PI / 180;
      var dLon = (toLon - fromLon) * toRad;
      var y = Math.sin(dLon) * Math.cos(toLat * toRad);
      var x = Math.cos(fromLat * toRad) * Math.sin(toLat * toRad) -
        Math.sin(fromLat * toRad) * Math.cos(toLat * toRad) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function routeSnappedHeading(lon, lat, travelHdg) {
      if (!routePath || routePath.length < 2) return null;
      var cosLat = Math.cos(lat * Math.PI / 180);
      var best = 0, bestD = Infinity;
      for (var i = 0; i < routePath.length; i++) {
        var dx = (routePath[i][0] - lon) * cosLat;
        var dy = routePath[i][1] - lat;
        var d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      if (bestD > 3e-7) return null;
      var fromIdx = Math.min(best, routePath.length - 2);
      var from = routePath[fromIdx];
      var seg = null;
      for (var j = fromIdx + 1; j < routePath.length; j++) {
        if (Math.abs(routePath[j][0] - from[0]) > 1e-7 || Math.abs(routePath[j][1] - from[1]) > 1e-7) {
          seg = bearing(from[0], from[1], routePath[j][0], routePath[j][1]);
          break;
        }
      }
      if (seg == null) return null;
      if (travelHdg != null) {
        var diff = ((seg - travelHdg + 540) % 360) - 180;
        if (Math.abs(diff) > 90) seg = (seg + 180) % 360;
      }
      return seg;
    }

    function vehicleLabelSymbol(plate, connected) {
      return {
        type: 'text', text: plate, color: '#fff',
        haloColor: connected ? '#14532D' : '#0A0A0A', haloSize: 2,
        yoffset: -40, font: { size: 11, weight: 'bold' }
      };
    }

    /**
     * Stop chasing the selected bus until follow is re-armed. Deliberately
     * leaves `followingTripId` alone — see the followCamReleased declaration.
     * Hoisted, so the view listeners in initMap can reference it.
     */
    function releaseFollowCamera() {
      if (!followingTripId || followCamReleased) return;
      followCamReleased = true;
      // A queued focus would re-grab the camera as soon as the bus redraws.
      pendingFocusTripId = null;
    }

    // Smooth camera: center on the car at street zoom. Throttled so ArcGIS
    // isn't flooded with goTo/center writes every animation frame.
    function syncNavCamera(lon, lat, hdg, force) {
      if (!view || !followingTripId || followCamReleased) return;
      var now = Date.now();
      if (!force && now - lastCamFollowAt < 320) return;
      lastCamFollowAt = now;
      view.goTo(
        { center: [lon, lat], zoom: Math.max(view.zoom || NAV_ZOOM, NAV_ZOOM) },
        { duration: force ? 850 : 280, easing: 'ease-out' }
      ).catch(function() {});
    }

    function vehicleAnimTick() {
      var now = Date.now();
      var any = false;
      Object.keys(vehicleMarkers).forEach(function(id) {
        var e = vehicleMarkers[id];
        if (!e.anim) return;
        var raw = Math.min(1, (now - e.anim.start) / VEHICLE_ANIM_MS);
        var p = easeInOut(raw);
        var lon = e.anim.fromLon + (e.anim.toLon - e.anim.fromLon) * p;
        var lat = e.anim.fromLat + (e.anim.toLat - e.anim.fromLat) * p;
        var hdg = lerpHeading(e.anim.fromHdg, e.anim.toHdg, p);
        var geom = { type: 'point', longitude: lon, latitude: lat };
        e.marker.geometry = geom;
        if (Math.round(hdg / 2) !== Math.round(e.hdg / 2)) {
          e.marker.symbol = vehicleSymbol(hdg);
        }
        e.label.geometry = geom;
        e.lon = lon; e.lat = lat; e.hdg = hdg;
        if (sameTripId(followingTripId, id)) {
          syncNavCamera(lon, lat, hdg, false);
          if (now - (e._lastProgressAt || 0) > 900) {
            e._lastProgressAt = now;
            paintRouteProgress(lon, lat);
          }
        }
        if (raw < 1) any = true; else e.anim = null;
      });
      if (any) {
        requestAnimationFrame(vehicleAnimTick);
      } else {
        vehicleAnimRunning = false;
        var followFe = findVehicleEntry(followingTripId);
        if (followingTripId && followFe) {
          syncNavCamera(followFe.lon, followFe.lat, followFe.hdg, false);
        }
      }
    }

    function drawVehicles(tracking) {
      if (!vehicleLayer) return;
      require(['esri/Graphic'], function(Graphic) {
        var seen = {};
        (tracking || []).forEach(function(t) {
          if (t.longitude == null || t.latitude == null) return;
          var tripKey = findVehicleKey(t.trip_id) || t.trip_id;
          seen[tripKey] = true;
          var connected = !!t.gps_connected;
          var e = vehicleMarkers[tripKey];
          if (!e) {
            var geom = { type: 'point', longitude: t.longitude, latitude: t.latitude };
            var initHdg = routeSnappedHeading(t.longitude, t.latitude, t.heading || null);
            if (initHdg == null) initHdg = t.heading || 0;
            var marker = new Graphic({
              geometry: geom,
              symbol: vehicleSymbol(initHdg),
              attributes: { tripId: t.trip_id, plate: t.vehicle_plate }
            });
            var label = new Graphic({
              geometry: geom,
              symbol: vehicleLabelSymbol(t.vehicle_plate, connected),
              attributes: { tripId: t.trip_id }
            });
            vehicleLayer.addMany([marker, label]);
            vehicleMarkers[tripKey] = {
              marker: marker, label: label,
              lon: t.longitude, lat: t.latitude, hdg: initHdg,
              travelHdg: t.heading || null,
              connected: connected, anim: null
            };
            if (sameTripId(pendingFocusTripId, t.trip_id) || sameTripId(followingTripId, t.trip_id)) {
              tryFocusVehicle();
            }
            return;
          }
          if (connected !== e.connected) {
            e.label.symbol = vehicleLabelSymbol(t.vehicle_plate, connected);
          }
          e.connected = connected;
          // Keep attribute in sync with latest id form from the server.
          e.marker.attributes.tripId = t.trip_id;
          e.label.attributes.tripId = t.trip_id;

          var movedMeters = Math.hypot(
            (t.latitude - e.lat) * 111320,
            (t.longitude - e.lon) * 111320 * Math.cos(t.latitude * Math.PI / 180)
          );
          if (movedMeters > 6) {
            e.travelHdg = bearing(e.lon, e.lat, t.longitude, t.latitude);
          } else if (e.travelHdg == null && t.heading) {
            e.travelHdg = t.heading;
          }

          var snapped = routeSnappedHeading(t.longitude, t.latitude, e.travelHdg);
          var newHdg = snapped != null ? snapped : (e.travelHdg != null ? e.travelHdg : e.hdg);
          if (movedMeters < 4) {
            var hDelta = Math.abs(((newHdg - e.hdg + 540) % 360) - 180);
            if (hDelta < 5) newHdg = e.hdg;
          }

          var far = Math.abs(t.longitude - e.lon) + Math.abs(t.latitude - e.lat) > 0.01;
          if (far) {
            var snapGeom = { type: 'point', longitude: t.longitude, latitude: t.latitude };
            e.marker.geometry = snapGeom;
            e.marker.symbol = vehicleSymbol(newHdg);
            e.label.geometry = snapGeom;
            e.lon = t.longitude; e.lat = t.latitude; e.hdg = newHdg;
            e.anim = null;
            if (sameTripId(followingTripId, t.trip_id)) syncNavCamera(e.lon, e.lat, e.hdg, true);
          } else {
            e.anim = {
              start: Date.now(),
              fromLon: e.lon, fromLat: e.lat, fromHdg: e.hdg,
              toLon: t.longitude, toLat: t.latitude, toHdg: newHdg
            };
            if (!vehicleAnimRunning) {
              vehicleAnimRunning = true;
              requestAnimationFrame(vehicleAnimTick);
            }
          }
        });
        Object.keys(vehicleMarkers).forEach(function(id) {
          if (!seen[id]) {
            var gone = vehicleMarkers[id];
            vehicleLayer.removeMany([gone.marker, gone.label]);
            delete vehicleMarkers[id];
            if (sameTripId(followingTripId, id)) followingTripId = null;
          }
        });
      });
    }

    function startFollow(tripId, forceZoom) {
      if (!tripId) {
        followingTripId = null;
        pendingFocusTripId = null;
        return;
      }
      followingTripId = tripId;
      pendingFocusTripId = tripId;
      followCamReleased = false;
      routeZoomSuppressedUntil = Date.now() + 5000;
      var fe = findVehicleEntry(tripId);
      if (fe) {
        pendingFocusTripId = null;
        lastCamFollowAt = 0;
        syncNavCamera(fe.lon, fe.lat, fe.hdg, true);
      } else if (forceZoom) {
        // Vehicle not drawn yet — keep pending until setTracking arrives.
      }
    }

    function tryFocusVehicle() {
      var id = pendingFocusTripId || followingTripId;
      if (!id || !view) return false;
      var fe = findVehicleEntry(id);
      if (!fe) return false;
      followingTripId = id;
      pendingFocusTripId = null;
      followCamReleased = false;
      lastCamFollowAt = 0;
      syncNavCamera(fe.lon, fe.lat, fe.hdg, true);
      return true;
    }

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || !data.type) return;
      if (data.type === 'setNetwork') drawNetwork(data);
      if (data.type === 'setRoute') drawRoute(data);
      if (data.type === 'setRouteFilter') drawRouteFilter(data);
      if (data.type === 'setTracking') {
        drawVehicles(data.tracking);
        refreshRouteProgressFromFollow();
      }
      if (data.type === 'setHighlightStop') applyHighlight(data.stopId);
      if (data.type === 'followVehicle') {
        startFollow(data.tripId || null, true);
        refreshRouteProgressFromFollow();
      }
      if (data.type === 'setCenter' && view && !followingTripId) {
        view.goTo({
          center: [data.longitude, data.latitude],
          zoom: data.zoom || 15
        }).catch(function() {});
      }
      if (data.type === 'fitBounds' && view && data.points && data.points.length) {
        followingTripId = null;
        pendingFocusTripId = null;
        require(['esri/geometry/Extent', 'esri/geometry/Point'], function(Extent, Point) {
          if (data.points.length === 1) {
            var p = data.points[0];
            view.goTo(
              { center: [p.longitude, p.latitude], zoom: 16 },
              { duration: 800 }
            ).catch(function() {});
            return;
          }
          var lngs = data.points.map(function(pt) { return pt.longitude; });
          var lats = data.points.map(function(pt) { return pt.latitude; });
          var pad = 0.01;
          view.goTo(new Extent({
            xmin: Math.min.apply(null, lngs) - pad,
            ymin: Math.min.apply(null, lats) - pad,
            xmax: Math.max.apply(null, lngs) + pad,
            ymax: Math.max.apply(null, lats) + pad,
            spatialReference: { wkid: 4326 }
          }), { duration: 800 }).catch(function() {});
        });
      }
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMap);
    } else {
      initMap();
    }
  </script>
</body>
</html>
